<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f8f5"><title>Running Tracker · 跑步训练记录</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><a class="brand" href="./">↗ RUNNING TRACKER</a><span class="badge">每一步，都算数</span></header><section class="hero"><div><p class="eyebrow">YOUR RUNNING JOURNEY</p><h1>记录奔跑，<br>看见进步<span>。</span></h1><p class="muted">从今天的第一公里，到下一次突破。</p></div><div class="hero-art" aria-hidden="true"><span>RUN</span><div class="track"></div><small>KEEP MOVING ↗</small></div></section>
<section class="stats" aria-label="跑量统计"><article><span>本周跑量</span><strong id="week">0<small> km</small></strong><p>周一至周日</p></article><article><span>本月跑量</span><strong id="month">0<small> km</small></strong><p id="month-label"></p></article><article><span>累计跑量</span><strong id="total">0<small> km</small></strong><p id="count">0 次训练</p></article></section>
<div class="workspace"><section class="panel form-panel"><div class="section-title"><h2 id="form-title">新增训练</h2><span>＋</span></div><p class="muted">记下今天的努力。</p><form id="run-form"><label>跑步日期<input id="date" type="date" required></label><label>距离 <span>km</span><input id="distance" type="number" inputmode="decimal" min="0.01" max="1000" step="0.01" placeholder="例如 5.00" required></label><label>用时 <span>时 / 分 / 秒</span><div class="time-inputs"><input id="hours" type="number" inputmode="numeric" min="0" max="999" step="1" value="0" aria-label="小时" required><b>:</b><input id="minutes" type="number" inputmode="numeric" min="0" max="59" step="1" placeholder="30" aria-label="分钟" required><b>:</b><input id="seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" aria-label="秒" required></div></label><label>平均心率 <span>bpm · 可选</span><input id="heart" type="number" inputmode="numeric" min="30" max="250" step="1" placeholder="例如 145"></label><div class="pace-box"><span>自动计算配速</span><strong id="pace-preview">— /km</strong></div><p id="form-error" role="alert"></p><button class="primary" id="save" type="submit">保存训练 ↗</button><button id="cancel" type="button" hidden>取消编辑</button></form></section>
<div class="right-column"><section class="panel"><div class="section-title"><h2>训练趋势</h2><select id="chart-mode" aria-label="趋势范围"><option value="week">最近 8 周</option><option value="month">最近 6 个月</option></select></div><p class="muted">跑量 / 公里</p><div id="chart" role="img" aria-label="跑量趋势图"></div><p id="chart-caption" class="muted"></p></section><section class="panel records-panel"><div class="section-title"><h2>训练记录 <span id="record-count">0</span></h2><span class="muted">最近在前</span></div><div id="records"></div></section></div></div><p id="storage-status" role="status" aria-live="polite"></p><footer><span>RUNNING TRACKER</span><span>数据仅保存在当前浏览器 · 清除浏览器数据会删除记录</span></footer></main></body></html>
